<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>juMper</title>
    <!-- Importing Inter for that clean, modern Swiss look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <div id="ui">
            <h1 id="score">0</h1>
            <h2 id="level">LEVEL 1</h2>
            <h3 id="high-score">HIGH SCORE: 0</h3>
            <h3 id="coin-display">COINS: <span id="coins">0</span></h3>
            <p id="shop-hint" style="font-size: 0.8rem; margin: 0; padding-top: 5px; opacity: 0.8; color: inherit;">[B]
                Jetpack (20)</p>
        </div>
        <canvas id="gameCanvas" width="500" height="700"></canvas>

        <div id="mobile-controls">
            <div id="left-controls">
                <button id="btn-left" class="control-btn">◀</button>
                <button id="btn-right" class="control-btn">▶</button>
            </div>
            <div id="right-controls">
                <button id="btn-jump" class="control-btn">▲</button>
                <button id="btn-buy" class="control-btn" style="font-size: 1.2rem; margin-top: 10px;">🚀</button>
            </div>
        </div>


        <div id="start-menu" class="overlay">
            <h1 class="game-title">juMper</h1>
            <h3 id="menu-high-score">HIGH SCORE: 0</h3>

            <div class="menu-sections">
                <div class="level-select">
                    <h4>SELECT MODE</h4>
                    <button class="level-btn active" data-mode="CLASSIC">Endless Classic</button>
                    <button class="level-btn" data-mode="DESCENT">The Descent</button>
                </div>
                <div class="profile-section">
                    <h4>YOUR RUNNER</h4>
                    <input type="text" id="username-input" placeholder="NAME" maxlength="15">
                    <p style="font-size: 0.7rem; margin-top: 5px; opacity: 0.6;">AUTOSAVED TO BROWSER</p>
                </div>
            </div>

            <div class="menu-actions">
                <button id="start-btn">PLAY</button>
                <div style="display: flex; gap: 10px;">
                    <button id="leaderboard-btn" style="flex: 1; font-size: 1rem; padding: 10px;">RANKINGS</button>
                    <button id="shop-btn" class="placeholder" style="flex: 1; font-size: 1rem; padding: 10px;">SHOP</button>
                </div>
            </div>
        </div>

        <div id="game-over" class="hidden">
            <h2>GAME OVER</h2>
            <p id="final-score">SCORE: 0</p>
            <p id="final-high-score">HIGH SCORE: 0</p>
            <p id="final-coins-display">COINS: <span id="final-coins">0</span></p>
            <div style="display: flex; gap: 15px; margin-top: 20px;">
                <button id="restart-btn" style="flex: 1;">RESTART</button>
                <button id="menu-btn"
                    style="flex: 1; padding: 15px; font-size: 20px; font-weight: 900; letter-spacing: 2px; font-family: 'Inter', sans-serif; background: transparent; border: 3px solid #111; color: #111; cursor: pointer; transition: transform 0.2s, background-color 0.2s;">MAIN
                    MENU</button>
            </div>
        </div>

        <!-- Pause Screen -->
        <div id="pause-screen" class="hidden"
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; font-family: 'Inter', sans-serif;">
            <h2 style="font-size: 3rem; margin: 0; letter-spacing: 5px; color: #fff;">PAUSED</h2>
            <p style="font-size: 1rem; color: #fff; opacity: 0.8; margin-top: 10px;">Press [P] or [ESC] to Resume</p>
            <button id="pause-menu-btn" style="margin-top: 30px; padding: 15px 30px; font-size: 18px; font-weight: 900; letter-spacing: 2px; font-family: 'Inter', sans-serif; background: transparent; border: 3px solid #fff; color: #fff; cursor: pointer; transition: transform 0.2s, background-color 0.2s;">MAIN MENU</button>
        </div>

        <!-- Dev Tools Panel -->
        <div id="dev-panel" class="hidden"
            style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: #fff; padding: 15px; border-radius: 8px; z-index: 200; font-family: 'Inter', sans-serif; font-size: 0.8rem; border: 2px solid #e705c9;">
            <h4 style="margin: 0 0 10px 0; color: #c296f5;">DEV TOOLS</h4>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                <button id="dev-lvl-btn" class="dev-btn">+ LEVEL</button>
                <button id="dev-coins-btn" class="dev-btn">+ COINS</button>
                <button id="dev-jet-btn" class="dev-btn">🚀 JETPACK</button>
                <button id="dev-heavy-btn" class="dev-btn">☄️ HEAVY</button>
                <button id="dev-moon-btn" class="dev-btn">🌙 MOON</button>
                <button id="dev-god-btn" class="dev-btn">👻 GOD: OFF</button>
            </div>
            <p id="dev-id-display" style="font-size: 0.5rem; margin-top: 10px; opacity: 0.5; word-break: break-all;">ID: FETCHING...</p>
        </div>

        <!-- Leaderboard Screen -->
        <div id="leaderboard-screen" class="overlay hidden">
            <h1 class="game-title" style="font-size: 3rem; margin-bottom: 10px;">RANKINGS</h1>
            
            <div class="leaderboard-tabs" style="display: flex; gap: 10px; margin-bottom: 20px; width: 90%; max-width: 400px;">
                <button id="tab-classic" class="tab-btn active" style="flex: 1; font-size: 0.8rem; padding: 10px;">CLASSIC</button>
                <button id="tab-descent" class="tab-btn" style="flex: 1; font-size: 0.8rem; padding: 10px;">DESCENT</button>
            </div>

            <div id="leaderboard-container">
                <table id="leaderboard-table">
                    <thead>
                        <tr>
                            <th>RANK</th>
                            <th>NAME</th>
                            <th>SCORE</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Mock data will be injected here -->
                    </tbody>
                </table>
            </div>
            <button id="close-leaderboard-btn" style="margin-top: 30px; width: 250px;">BACK TO MENU</button>
        </div>
    </div>

    <svg width="0" height="0" style="position: absolute;">
        <filter id="sketchy">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/globals.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
